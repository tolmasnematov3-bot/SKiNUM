<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKiNUM</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    background: #0e121c;
    border-bottom: 1px solid #202738;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    color: #6ee7ff;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user {
    background: #151b28;
    padding: 10px 15px;
    border-radius: 10px;
    color: #7df5a5;
    font-size: 14px;
}

.logout {
    background: #ef4444;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.login {
    background: #1b73e8;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px;
}

.hero {
    text-align: center;
    padding: 35px 10px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.hero p {
    color: #8993a8;
}

.status {
    margin: 25px auto;
    padding: 15px;
    max-width: 500px;
    background: #101722;
    border: 1px solid #263247;
    border-radius: 12px;
    text-align: center;
}

.cases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.case {
    background: #111722;
    border: 1px solid #273044;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
}

.case h2 {
    margin-top: 0;
}

.price {
    font-size: 22px;
    font-weight: bold;
    color: #ffd166;
    margin: 15px 0;
}

.case button {
    border: 0;
    padding: 12px 20px;
    border-radius: 10px;
    background: #36c7ff;
    color: #061018;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #667085;
    padding: 40px 20px;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        SKiNUM
    </div>

    <div class="user-area" id="userArea">

        <button class="login" onclick="loginSteam()">
            LOGIN WITH STEAM
        </button>

    </div>

</header>


<main>

<section class="hero">

    <h1>
        SKiNUM
    </h1>

    <p>
        CS2 Skin Case Marketplace
    </p>

</section>


<div class="status" id="status">
    Connecting to SKiNUM server...
</div>


<section class="cases">

    <div class="case">

        <h2>
            🔪 Knife Case
        </h2>

        <p>
            Premium knife skins
        </p>

        <div class="price">
            $25
        </div>

        <button onclick="openCase('Knife')">
            OPEN CASE
        </button>

    </div>


    <div class="case">

        <h2>
            🔫 Weapon Case
        </h2>

        <p>
            Rare CS2 weapon skins
        </p>

        <div class="price">
            $5
        </div>

        <button onclick="openCase('Weapon')">
            OPEN CASE
        </button>

    </div>


    <div class="case">

        <h2>
            🎯 AWP Case
        </h2>

        <p>
            AWP skin collection
        </p>

        <div class="price">
            $10
        </div>

        <button onclick="openCase('AWP')">
            OPEN CASE
        </button>

    </div>

</section>

</main>


<footer>

    SKiNUM © 2026

</footer>


<script>


/* ==============================
   STEAM LOGIN
============================== */

function loginSteam() {

    window.location.href = "/auth/steam";

}


/* ==============================
   LOAD CURRENT USER
============================== */

async function loadUser() {

    try {

        const response = await fetch("/api/me");

        const data = await response.json();

        const userArea =
            document.getElementById("userArea");


        if (data.loggedIn) {

            userArea.innerHTML = `

                <div class="user">
                    🟢 Steam Connected
                </div>

                <button
                    class="logout"
                    onclick="logoutSteam()"
                >
                    LOGOUT
                </button>

            `;

            document.getElementById("status").innerHTML =
                "🟢 Steam account connected";

        }

    } catch (error) {

        console.log(error);

    }

}


/* ==============================
   LOGOUT
============================== */

function logoutSteam() {

    window.location.href =
        "/auth/logout";

}


/* ==============================
   SERVER STATUS
============================== */

async function checkServer() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();

        document.getElementById("status").innerHTML =
            "🟢 SKiNUM server ONLINE — " +
            data.version;

    } catch (error) {

        document.getElementById("status").innerHTML =
            "🔴 Server connection failed";

    }

}


/* ==============================
   CASE
============================== */

function openCase(type) {

    alert(
        type +
        " Case will be connected to the backend next."
    );

}


/* ==============================
   START
============================== */

checkServer();

loadUser();

</script>

</body>
</html>
